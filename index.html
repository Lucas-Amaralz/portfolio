<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Última Luz Acesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: uma coluna central. Tela de jogo 16:9 com caixa de diálogo embaixo; no fim, o monitor do garoto vira o portfólio. */
:root{
  --ink:#06070d;      /* fundo da noite */
  --bone:#ece6d4;     /* texto, bordas das caixas */
  --dim:#9a97b2;      /* texto secundário */
  --amber:#ffb648;    /* a luz da janela, o cursor de escolha */
  --cyan:#6ff3e0;     /* brilho do monitor */
  --beige:#c9c2ae;    /* carcaça do CRT */
  --beige-d:#a39b86;
  --screen:#0a1a20;
  --display:'Pixelify Sans','Trebuchet MS',sans-serif;
  --body:'IBM Plex Mono',Consolas,'Courier New',monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--ink);margin:0}
body{color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--dim)}
.brand b{color:var(--bone);font-weight:700}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--bone);background:transparent;border:2px solid var(--bone);border-radius:4px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--bone);color:var(--ink)}
button:focus-visible{outline:2px dashed var(--amber);outline-offset:3px}

.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer;border-radius:6px}
.stage canvas{width:100%;height:100%;display:block}
.stage::after,.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.07) 2px 3px)}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;pointer-events:none;padding-inline:16px}
.title h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6.4vw,64px);letter-spacing:.04em;margin:0;color:#fff;text-shadow:0 3px 0 #2a1840,0 0 24px rgba(42,24,64,.6);text-wrap:balance}
.title p{margin:0;font-size:clamp(14px,2vw,18px);font-weight:600;color:#2a1840;background:rgba(255,255,255,.8);padding:4px 12px;border-radius:4px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.dialog{position:relative;border:3px solid var(--bone);border-radius:8px;background:#05060b;padding:16px 20px 26px;min-height:170px;display:flex;gap:16px;align-items:flex-start;cursor:pointer}
.portrait{width:84px;height:84px;flex:none;border:2px solid var(--dim);border-radius:6px;background:#000}
.dtext{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.who{font-family:var(--display);font-size:15px;letter-spacing:.1em;color:var(--amber);min-height:18px}
.line{font-size:clamp(16px,2.1vw,20px);white-space:pre-wrap;margin:0;min-height:2.9em}
.choices{display:flex;flex-wrap:wrap;gap:4px 32px}
.choice{font-family:var(--body);font-size:clamp(16px,2.1vw,20px);font-weight:500;color:var(--bone);background:none;border:0;padding:2px 0 2px 22px;cursor:pointer;position:relative;text-align:left}
.choice.on{color:var(--amber)}
.choice.on::before{content:"";position:absolute;left:2px;top:50%;border-left:10px solid var(--amber);border-block:7px solid transparent;transform:translateY(-50%)}
.next{position:absolute;right:16px;bottom:8px;font-size:16px;color:var(--amber);animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.help{font-size:14px;color:var(--dim);margin:0}
@media (max-width:560px){.portrait{width:56px;height:56px}.dialog{padding:12px 12px 24px;gap:10px;min-height:160px}}

/* ---------- o computador do garoto ---------- */
.desktop{display:flex;flex-direction:column;gap:12px}
.bezel{background:var(--beige);border-radius:10px;padding:clamp(10px,3vw,28px);box-shadow:inset -6px -6px 0 var(--beige-d),inset 5px 5px 0 #e2dccb}
.screen{position:relative;background:radial-gradient(ellipse at center,#0f2830 0%,var(--screen) 70%);border-radius:6px;min-height:560px;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 0 3px #04090c,inset 0 0 40px rgba(111,243,224,.08)}
.topbar{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;background:var(--cyan);color:var(--screen);font-family:var(--display);font-size:14px;letter-spacing:.06em}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 8px;padding:26px 16px;align-content:start;flex:1}
.icon{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;color:var(--bone);font-family:var(--body);font-size:15px;cursor:pointer;padding:8px 4px}
.icon .lbl{padding:1px 5px;border-radius:3px}
.icon:hover .lbl,.icon.on .lbl{background:var(--cyan);color:var(--screen)}
.ico{position:relative;width:52px;height:40px;border-radius:3px}
.ico.folder{background:var(--amber);box-shadow:inset 0 -9px 0 #d98a2a;margin-top:6px}
.ico.folder::before{content:"";position:absolute;left:0;top:-6px;width:22px;height:6px;background:var(--amber);border-radius:3px 3px 0 0}
.ico.file{width:38px;height:46px;background:repeating-linear-gradient(to bottom,var(--bone) 0 7px,#9b957f 7px 9px);border:3px solid var(--bone)}
.ico.exe{background:#000;border:3px solid var(--cyan);color:var(--cyan);font-family:var(--body);font-size:16px;font-weight:600;display:grid;place-items:center}
.tip{position:relative;z-index:1;padding:10px 14px;border-top:2px solid rgba(111,243,224,.3);color:var(--bone);font-size:15px}
.tip b{color:var(--amber);font-weight:600}

.win{position:absolute;top:46px;right:16px;bottom:58px;width:min(600px,calc(100% - 32px));background:#05070a;border:3px solid var(--bone);border-radius:6px;display:flex;flex-direction:column;z-index:2;box-shadow:8px 8px 0 rgba(0,0,0,.5);overflow:hidden}
@media (max-width:640px){.win{left:8px;right:8px;width:auto;top:40px;bottom:8px}}
.wtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bone);color:#000;font-family:var(--display);font-size:14px;letter-spacing:.04em;padding:4px 4px 4px 10px}
.wclose{font-family:var(--display);font-size:13px;background:#000;color:var(--bone);border:0;border-radius:3px;padding:4px 8px;cursor:pointer}
.wbody{overflow:auto;padding:16px 18px;color:var(--bone);font-size:16px;min-height:0;flex:1}
.wbody h2{font-family:var(--display);font-size:24px;font-weight:700;color:var(--amber);margin:0 0 6px;letter-spacing:.02em;text-wrap:balance}
.wbody h3{font-family:var(--display);font-size:18px;font-weight:700;color:var(--bone);margin:0 0 4px;letter-spacing:.02em}
.wbody p{margin:0 0 12px;max-width:62ch}
.kv{color:var(--dim)}
.proj{border-top:2px dashed #23353b;padding-block:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font-size:13px;color:var(--cyan);border:1px solid var(--cyan);border-radius:3px;padding:1px 7px}
.wbody a{color:var(--cyan)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.mono{background:#111;padding:2px 8px;border-radius:3px;user-select:all;overflow-wrap:anywhere}
.small{font-size:13px;color:var(--dim)}
.wbody ul{margin:0;padding-left:20px;max-width:62ch}
.wbody li{margin-bottom:3px}
.proj .kv{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.title p,.next{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <div class="brand"><b id="brandName">LUCAS NUNES AMARAL</b> · PORTFÓLIO</div>
    <div class="ctrls">
      <button class="btn" id="btnSound" type="button" aria-pressed="true">SOM: ON</button>
      <button class="btn" id="btnSkip" type="button">PULAR → PERFIL</button>
    </div>

  <div class="stage" id="stage">

  <section class="desktop" id="desktop" hidden>
    <div class="bezel">
      <div class="screen">
        <div class="topbar"><span>FUTURO.OS v0.1</span><span id="clock">ANO 2087</span></div>
        <div class="icons" id="icons"></div>
        <div class="win" id="win" hidden>
          <div class="wtitle"><span id="wtitle"></span><button class="wclose" id="wclose" type="button" aria-label="Fechar janela">[X]</button></div>

</div>

<script>
/* =========================================================
   1) SEUS DADOS — edite só aqui
   ========================================================= */
const PERFIL = {

  curto: "Lucas",
  papel: "técnico de suporte e infraestrutura",

    { cargo: "Suporte Técnico / Infra (Estágio)", empresa: "Prefeitura Municipal de Guaíba", periodo: "Jul 2024 – Abr 2025",
      resumo: "Suporte presencial e remoto para vários setores da Prefeitura, incluindo saúde, assistência social e escolas.",
      itens: ["Resolução de incidentes de hardware, software e infraestrutura", "Administração de usuários e permissões no Active Directory", "Aplicação e manutenção de políticas de segurança", "Configuração de roteadores e switches", "Monitoramento da infraestrutura com Zabbix", "Treinamento de novos estagiários"] }
  ],
  habilidades: [
    ["Cloud", ["Microsoft Azure", "AWS IAM", "EC2", "S3", "RDS", "Lambda", "Ambientes híbridos"]],
    ["Identidade e Microsoft", ["Entra ID", "Active Directory", "Microsoft 365", "IAM"]],

    ["Segurança", ["ISO/IEC 27001", "TISAX", "Hardening", "Políticas de segurança"]],
    ["Sistemas e suporte", ["Windows", "Linux", "macOS", "Suporte N1/N2", "Troubleshooting", "Documentação técnica"]]
  ],
  certificacoes: [
    ["AWS Certified Cloud Practitioner (CLF-C02)", "Amazon Web Services · válido de 2025 a 2028"],
    ["Graduado AWS re/Start", "Escola da Nuvem · 2025"],
    ["Administrador de Redes Multiplataforma", "Sisnema · 2024"]
  ],
  formacao: [
    ["Análise e Desenvolvimento de Sistemas", "Universidade Ulbra · Fev 2023 – Dez 2025"],
    ["Inglês avançado (C1)", "Instituto de Idiomas Insight"]
  ],
  contato: {
    email: "Amlucaz@gmail.com",
    linkedin: "https://www.linkedin.com/in/lucas-amaral-ti",
    github: "",
    curriculo: ""
  }
};

/* =========================================================
   2) ROTEIRO — cada nó tem texto, quem fala e para onde vai
   enter: troca de cena antes de mostrar o texto (zoom se houver ponto em ZOOM, senão fade)
   ========================================================= */
const SCRIPT = {
  // o mundo antes
  f1: { text: "* Era uma vez um mundo cheio de cor.", next: "f2" },
  f2: { text: "* Os campos davam comida para todos, as feiras viviam cheias e cada pessoa tinha um ofício do qual se orgulhava.", next: "f3" },
  f3: { text: "* Ferreiros, padeiros, artistas, agricultores... todo mundo tinha o seu lugar.", next: "f4" },
  f4: { text: "* Até que alguém teve uma ideia:\n* \"E se as máquinas fizessem todo o trabalho por nós?\"", next: "m1" },
  // a revolução das máquinas
  m1: { enter: "fall", text: "* No começo, elas pareciam ajudantes. Carregavam peso, colhiam o trigo, varriam as ruas.", next: "m2" },
  m2: { text: "* Mas elas aprendiam rápido. Mais rápido do que qualquer pessoa.", next: "m3" },
  m3: { text: "* Uma a uma, as oficinas fecharam. As fábricas não precisavam mais de gente.", next: "m4" },
  m4: { text: "* Milhões de pessoas perderam o emprego. Sem salário, as feiras esvaziaram.", next: "m5" },
  m5: { text: "* A comida ficou escassa e as filas cresceram.\n* E as máquinas continuaram construindo... outras máquinas.", next: "m6" },
  m6: { text: "* Os livros chamariam aquilo de A Revolução das Máquinas.", next: "i1" },
  // o mundo depois
  i1: { enter: "world", text: "* Em poucos anos, as máquinas tomaram conta de tudo.", next: "i2" },
  i2: { text: "* As cidades se apagaram, uma por uma.", next: "i3" },
  i3: { text: "* E muita gente parou de tentar.", next: "i4" },
  i4: { text: "* Mas lá longe, no fim da estrada...", next: "h1" },
  h1: { enter: "house", text: "* ...uma luz continuava acesa.", next: "h2" },
  h2: { text: "* Ali morava um garoto que se recusava a desistir.", next: "h3" },
  h3: { text: "* O que você faz?", choices: [["Chegar mais perto", "r1"], ["Esperar aqui fora", "h4"]] },
  h4: { text: "* Você espera. O vento sopra.\n* A luz continua acesa, como se esperasse por você.", choices: [["Chegar mais perto", "r1"]] },
  // o garoto
  r1: { enter: "room", who: "kid", text: "Ah! Uma visita. Faz tempo que ninguém aparece por aqui.", next: "r2" },
  r2: { who: "kid", text: "Desculpa a bagunça. Tô rodando um script aqui.", choices: [["Quem é você?", "r3a"], ["O que você está fazendo?", "r3b"]] },
  r3a: { who: "kid", reveal: true, text: "Eu sou {curto}, {papel}.", next: "r3a2" },
  r3a2: { who: "kid", text: "Enquanto as máquinas tomam conta de tudo, eu mantenho os servidores de pé, os acessos no lugar e o que der automatizado.", next: "r6" },
  r3b: { who: "kid", text: "Automatizando com PowerShell. Se uma tarefa se repete, eu transformo em script.", next: "r3b2" },
  r3b2: { who: "kid", reveal: true, text: "Ah, foi mal, nem me apresentei. Sou {curto}, {papel}.", next: "r6" },
  r6: { who: "kid", text: "Sabe, todo mundo diz que não adianta mais. Que as máquinas já venceram.", choices: [["E não venceram?", "r7"], ["Por que você continua?", "r8"]] },
  r7: { who: "kid", text: "Elas fazem o trabalho, é verdade. Mas alguém precisa entender como elas funcionam, manter tudo de pé e consertar quando quebra.", next: "r9" },
  r8: { who: "kid", text: "Porque desistir é o único jeito garantido de perder. Cada problema que eu resolvo é um passo a mais.", next: "r9" },
  r9: { who: "kid", text: "Eu estudo toda noite. Já tirei certificação, já errei muito e vou errar de novo.\nMas parar? Isso não.", next: "r10" },
  r10: { who: "kid", text: "Se o futuro vai ser das máquinas, eu quero ser quem mantém elas funcionando.", next: "r4" },
  r4: { who: "kid", text: "Tá tudo guardado aqui no meu computador: quem eu sou, onde trabalhei, minhas certificações e como falar comigo.", choices: [["Mostrar", "r5"], ["Mostrar (com entusiasmo)", "r5b"]] },
  r5: { who: "kid", text: "Então chega mais perto da tela.", next: "DESKTOP" },
  r5b: { who: "kid", text: "Gostei da energia! Chega mais perto da tela.", next: "DESKTOP" }
};

/* =========================================================
   3) CENÁRIOS (mundo de 192 x 108 unidades, desenhados em vetor direto no canvas)
   ========================================================= */
const W = 192, H = 108, TAU = Math.PI * 2;
const cvs = document.getElementById("screen"), o = cvs.getContext("2d");
const R = (x, y, w, h, c) => { o.fillStyle = c; o.fillRect(x, y, w, h); };
const C = (x, y, r, c) => { o.fillStyle = c; o.beginPath(); o.arc(x, y, r, 0, TAU); o.fill(); };
const E = (x, y, rx, ry, c) => { o.fillStyle = c; o.beginPath(); o.ellipse(x, y, rx, ry, 0, 0, TAU); o.fill(); };
const RR = (x, y, w, h, r, c) => { o.fillStyle = c; o.beginPath(); o.roundRect ? o.roundRect(x, y, w, h, r) : o.rect(x, y, w, h); o.fill(); };
const poly = (c, ...p) => { o.fillStyle = c; o.beginPath(); o.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) o.lineTo(p[i], p[i + 1]); o.closePath(); o.fill(); };
const alpha = (a, fn) => { o.globalAlpha = a; fn(); o.globalAlpha = 1; };
function vgrad(y0, y1, stops) { const g = o.createLinearGradient(0, y0, 0, y1); stops.forEach(([k, c]) => g.addColorStop(k, c)); o.fillStyle = g; o.fillRect(-1, y0, W + 2, y1 - y0); }
// luz suave aditiva; c precisa ser hex de 6 dígitos
function glow(x, y, r, c, a = 1) {
  const g = o.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, c + "00");
  o.globalCompositeOperation = "lighter"; o.globalAlpha = a; o.fillStyle = g; o.fillRect(x - r, y - r, r * 2, r * 2);
  o.globalAlpha = 1; o.globalCompositeOperation = "source-over";
}
// colina ondulada; devolve a função de altura para posicionar coisas em cima dela
function hill(base, a1, f1, a2, f2, ph, c) {
  const y = x => base - Math.sin(x * f1 + ph) * a1 - Math.sin(x * f2 + ph * 2) * a2;
  o.fillStyle = c; o.beginPath(); o.moveTo(-1, H + 1);
  for (let x = -1; x <= W + 1; x += 2) o.lineTo(x, y(x));
  o.lineTo(W + 1, H + 1); o.closePath(); o.fill(); return y;
}
function rng(s) { return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(7);
const STARS = Array.from({ length: 48 }, () => ({ x: rand() * W | 0, y: rand() * 62 | 0, p: rand() * 6.28, s: .6 + rand() * 2.4 }));
const BUILDINGS = []; for (let x = -2; x < W;) { const w = 5 + (rand() * 10 | 0); BUILDINGS.push({ x, w, h: 8 + (rand() * 22 | 0), n: rand(), win: rand() }); x += w + (rand() < .3 ? 1 : 0); }
const TUFTS = Array.from({ length: 34 }, () => ({ x: rand() * W | 0, y: 74 + (rand() * 32 | 0) }));
const CODE = Array.from({ length: 14 }, () => 4 + (rand() * 22 | 0));
const FLOWERS = Array.from({ length: 46 }, () => ({ x: rand() * W, k: rand(), c: ["#ff6b8a", "#ffd84a", "#ffffff", "#ff8a3a", "#c88bff"][rand() * 5 | 0] }));
const QUEUE = [[108, "#6a5a6a", "#d9a87e"], [117, "#5a6a7a", "#b07850"], [126, "#7a6050", "#e8c09a"], [135, "#4a5a5a", "#8a5a3a"], [144, "#6a5048", "#d9a87e"], [153, "#5a5070", "#b07850"], [162, "#585058", "#e8c09a"]];

function stars(t, maxY) {
  for (const s of STARS) if (s.y < maxY) alpha(.3 + .7 * Math.max(0, Math.sin(t * s.s + s.p)), () => C(s.x + .5, s.y + .5, .45, "#ece6d4"));
}
function tower(cx, base, h, t, ph, w0 = 10) {

    RR(52, 52, 6, 40, 1.5, "#3a2a3a"); RR(52, 84, 26, 4, 1, "#3a2a3a"); R(62, 88, 3, 20, "#2a1e2a");
    // o garoto
    const bob = talking ? (Math.sin(t * 14) > 0 ? .6 : 0) : 0, hy = 44 + bob;
    RR(58, 60, 18, 26, 3, "#3d5a80"); RR(58, 60, 4, 26, 2, "#2e4766"); RR(60, 58, 12, 4, 2, "#2e4766");
    R(68, hy + 12, 4, 4, "#d4a47c");
    RR(64, hy, 14, 14, 4, "#e2b48a");
    RR(63, hy - 2, 16, 5, 2.5, "#2a1c18"); RR(63, hy + 2, 5, 10, 2, "#2a1c18"); RR(76, hy + 2, 3, 3, 1.5, "#2a1c18");
    E(67.8, hy + 7.5, 1.3, 1.8, "#c99a72");
    const blink = (t % 4) < .12;
    R(74.2, hy + 5.6, 2.6, .6, "#2a1c18");
    E(75.5, hy + 8, .6, blink ? .15 : .9, "#1a1214");
    E(78.4, hy + 8.6, .8, 1, "#e2b48a");
    alpha(.25, () => C(75.6, hy + 10.2, 1.2, "#ff8a8a"));
    if (talking && Math.sin(t * 22) > 0) E(76.8, hy + 11.3, 1, .7, "#7a3a3a"); else R(76, hy + 11, 2, .6, "#b98a66");
    glow(79, hy + 7, 7, "#6ff3e0", .2);
    const tap = !talking && Math.sin(t * 18) > 0 ? .8 : 0;
    RR(70, 66, 16, 4, 2, "#3d5a80"); RR(85, 67 - tap, 4.5, 3, 1.5, "#e2b48a");
  }
};

/* Retrato que aparece na caixa de diálogo (desenhado em 24 unidades, 4x de resolução) */
const pc = document.getElementById("portrait"), p = pc.getContext("2d");
function drawPortrait(t) {
  const P = (x, y, w, h, r, c) => { p.fillStyle = c; p.beginPath(); p.roundRect ? p.roundRect(x, y, w, h, r) : p.rect(x, y, w, h); p.fill(); };
  p.setTransform(4, 0, 0, 4, 0, 0);
  const g = p.createLinearGradient(0, 0, 0, 24); g.addColorStop(0, "#10242c"); g.addColorStop(1, "#05080c"); p.fillStyle = g; p.fillRect(0, 0, 24, 24);
  P(3, 19.5, 18, 6, 4, "#3d5a80"); P(9.5, 17, 5, 3, 1, "#d4a47c");
  P(4.8, 10, 2, 3, 1, "#d4a47c"); P(17.2, 10, 2, 3, 1, "#d4a47c");
  P(6, 5.5, 12, 13.5, 4.5, "#e2b48a");
  P(5, 2.5, 14, 5.5, 3, "#2a1c18"); P(5, 5, 2.2, 7, 1, "#2a1c18"); P(16.8, 5, 2.2, 7, 1, "#2a1c18"); P(8, 6, 5, 2, 1, "#2a1c18");
  P(8.5, 9.2, 2.6, .6, .3, "#2a1c18"); P(12.9, 9.2, 2.6, .6, .3, "#2a1c18");
  const blink = (t % 4) < .12;
  for (const ex of [9, 13.2]) {
    if (blink) P(ex - .2, 11.4, 2.2, .5, .25, "#1a1214");
    else { P(ex, 10.4, 1.8, 2.3, .9, "#1a1214"); P(ex + .8, 10.7, .6, .6, .3, "#ffffff"); }
  }
  p.globalAlpha = .3; P(7.2, 13.3, 2.2, 1.2, .6, "#ff8a8a"); P(14.6, 13.3, 2.2, 1.2, .6, "#ff8a8a"); p.globalAlpha = 1;
  const open = talking && Math.sin(t * 22) > 0;
  if (open) P(10.8, 15.1, 2.4, 1.6, .8, "#7a3a3a"); else P(10.6, 15.6, 2.8, .6, .3, "#b98a66");
  p.globalAlpha = .12; P(12, 5.5, 6, 13.5, 3, "#6ff3e0"); p.globalAlpha = 1;
}

/* =========================================================
   4) CÂMERA, ZOOM E LOOP
   ========================================================= */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let scene = "fantasy", cam = { x: 96, y: 54, z: 1 }, fade = 0, talking = false, runId = 0;
const ZOOM = { house: [151, 84], room: [113, 64], desk: [118, 55] };

function render(now) {
  const t = now / 1000;
  if (!stageEl.hidden) {
    const cw = cvs.width, ch = cvs.height, s = cw / W * cam.z;
    o.setTransform(1, 0, 0, 1, 0, 0); o.fillStyle = "#000"; o.fillRect(0, 0, cw, ch);
    o.setTransform(s, 0, 0, s, cw / 2 - cam.x * s, ch / 2 - cam.y * s);
    o.lineCap = "round";
    SCENES[scene](t);
    o.setTransform(1, 0, 0, 1, 0, 0);
    if (fade > 0) { o.fillStyle = `rgba(0,0,0,${Math.min(1, fade)})`; o.fillRect(0, 0, cw, ch); }
    if (!pc.hidden) drawPortrait(t);
  }
  requestAnimationFrame(render);
}
function tween(fn, dur) {
  const run = runId, start = performance.now();
  return new Promise(res => {
    const step = now => {
      if (run !== runId) return;
      const k = Math.min(1, (now - start) / dur); fn(k);
      k < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}
async function zoomInto(x, y, next, stay) {
  if (reduced) {
    await tween(k => fade = k, 300);
  } else {
    await tween(k => {
      const e = k * k * k, m = 1 - Math.pow(1 - k, 2);
      cam = { x: 96 + (x - 96) * m, y: 54 + (y - 54) * m, z: 1 + 9 * e };
      fade = k > .6 ? (k - .6) / .4 : 0;
    }, 1700);
  }
  if (stay) return;
  scene = next; cam = { x: 96, y: 54, z: reduced ? 1 : 1.5 };
  await tween(k => { if (!reduced) cam.z = 1.5 - .5 * (1 - Math.pow(1 - k, 3)); fade = 1 - k; }, reduced ? 300 : 800);
}
async function fadeTo(next) {
  await tween(k => fade = k, reduced ? 300 : 900);
  scene = next; cam = { x: 96, y: 54, z: 1 };
  await tween(k => fade = 1 - k, reduced ? 300 : 1100);
}

/* =========================================================
   5) MOTOR DE DIÁLOGO
   ========================================================= */
const stageEl = document.getElementById("stage"), titleEl = document.getElementById("title");
const dialogEl = document.getElementById("dialog"), lineEl = document.getElementById("line");
const whoEl = document.getElementById("who"), choicesEl = document.getElementById("choices");
const arrowEl = document.getElementById("nextArrow"), helpEl = document.getElementById("help");
const deskEl = document.getElementById("desktop");
let started = false, busy = false, known = false, cur = null, typing = false, typeTimer = null, full = "", sel = 0, choiceBtns = [];

const fill = s => s.replace(/\{(\w+)\}/g, (_, k) => PERFIL[k] ?? "");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let actx = null, muted = false;
function initAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) { actx = null; } }
function blip(f) {
  if (muted || !actx) return;
  try {
    const osc = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
    osc.type = "square"; osc.frequency.value = f * (.95 + Math.random() * .1);
    g.gain.setValueAtTime(.035, now); g.gain.exponentialRampToValueAtTime(.0001, now + .06);
    osc.connect(g).connect(actx.destination); osc.start(now); osc.stop(now + .07);
  } catch (e) {}
}

function setSpeaker(n) {
  const kid = n && n.who === "kid";
  whoEl.textContent = kid ? (known ? PERFIL.curto.toUpperCase() : "???") : "";
  pc.hidden = !kid;
}
function clearChoices() { choicesEl.innerHTML = ""; choiceBtns = []; }

async function go(id) {
  clearChoices(); arrowEl.hidden = true;
  if (id === "DESKTOP") {
    busy = true; lineEl.textContent = ""; setSpeaker(null);
    await zoomInto(ZOOM.desk[0], ZOOM.desk[1], null, true);
    openDesktop(false); return;
  }
  const n = SCRIPT[id]; cur = n;
  if (n.enter && n.enter !== scene) {
    busy = true; lineEl.textContent = ""; setSpeaker(null);
    if (ZOOM[n.enter]) await zoomInto(ZOOM[n.enter][0], ZOOM[n.enter][1], n.enter);
    else await fadeTo(n.enter);
    busy = false;
  }
  if (n.reveal) known = true;
  setSpeaker(n); type(n);
}
function type(n) {
  full = fill(n.text); lineEl.textContent = ""; typing = true; talking = n.who === "kid";
  let i = 0; const run = runId;
  const tick = () => {
    if (run !== runId) return;
    const ch = full[i++]; lineEl.textContent = full.slice(0, i);
    if (ch && ch.trim() && i % 2) blip(n.who === "kid" ? 620 : 300);
    if (i >= full.length) return done();
    typeTimer = setTimeout(tick, /[.!?]/.test(ch) ? 160 : ch === "," ? 120 : 26);
  };
  tick();
}
function done() {
  clearTimeout(typeTimer); typing = false; talking = false; lineEl.textContent = full;
  if (cur.choices) {
    sel = 0;
    choiceBtns = cur.choices.map(([label, next], i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "choice"; b.textContent = label;
      b.addEventListener("click", e => { e.stopPropagation(); pick(i); });
      b.addEventListener("mouseenter", () => mark(i));
      choicesEl.appendChild(b); return b;
    });
    mark(0);
  } else arrowEl.hidden = false;
}
function mark(i) { sel = i; choiceBtns.forEach((b, k) => b.classList.toggle("on", k === i)); }
function pick(i) { if (busy || typing) return; blip(440); go(cur.choices[i][1]); }

function begin() { started = true; initAudio(); titleEl.hidden = true; go("f1"); }
function advance() {
  if (!started) return begin();
  if (busy) return;
  if (typing) return done();
  if (cur.choices) return pick(sel);
  if (cur.next) go(cur.next);
}

document.addEventListener("keydown", e => {
  if (!deskEl.hidden) { if (e.key === "Escape") closeWin(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("button")) return;
  if (["Enter", " ", "z", "Z"].includes(e.key)) { e.preventDefault(); advance(); }
  else if (choiceBtns.length && ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(e.key)) {
    e.preventDefault(); const d = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
    mark((sel + d + choiceBtns.length) % choiceBtns.length); blip(520);
  }
});
stageEl.addEventListener("click", advance);
dialogEl.addEventListener("click", advance);

/* =========================================================
   6) O COMPUTADOR (portfólio)
   ========================================================= */
const ICONS = [
  { id: "sobre", label: "sobre_mim/", cls: "folder" },
  { id: "exp", label: "experiencia/", cls: "folder" },
  { id: "skills", label: "habilidades/", cls: "folder" },
  { id: "certs", label: "certificacoes/", cls: "folder" },
  { id: "contato", label: "contato.txt", cls: "file" },
  { id: "replay", label: "rever_historia.exe", cls: "exe" }
];
const link = (label, url) => url ? `<div class="row"><span class="kv">${label}:</span><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\/(www\.)?/, ""))}</a></div>` : "";
const WINS = {
  sobre: () => `<h2>${esc(PERFIL.nome)}</h2>
    <p class="kv">${esc(PERFIL.cargo)} · ${esc(PERFIL.local)}</p>
    ${PERFIL.bio.map(b => `<p>${esc(b)}</p>`).join("")}
    <p><span class="kv">Procurando:</span> ${esc(PERFIL.buscando)}</p>`,
  exp: () => `<h2>Experiência</h2>` + PERFIL.experiencia.map(x => `<div class="proj">
    <h3>${esc(x.cargo)}</h3><p class="kv">${esc(x.empresa)} · ${esc(x.periodo)}</p>
    <p>${esc(x.resumo)}</p><ul>${x.itens.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join(""),
  skills: () => `<h2>Habilidades</h2>` + PERFIL.habilidades.map(([cat, itens]) => `<div class="proj">
    <h3>${esc(cat)}</h3><div class="chips">${itens.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>`).join(""),
  certs: () => `<h2>Certificações</h2>` + PERFIL.certificacoes.map(([n, d]) => `<div class="proj"><h3>${esc(n)}</h3><p class="kv">${esc(d)}</p></div>`).join("") +
    `<h2 style="margin-top:18px">Formação e idiomas</h2>` + PERFIL.formacao.map(([n, d]) => `<div class="proj"><h3>${esc(n)}</h3><p class="kv">${esc(d)}</p></div>`).join(""),
  contato: () => `<h2>Contato</h2>
    <div class="row"><span class="kv">email:</span><span class="mono" id="mail">${esc(PERFIL.contato.email)}</span><button class="btn" type="button" id="copyMail">COPIAR</button></div>
    ${link("linkedin", PERFIL.contato.linkedin)}${link("github", PERFIL.contato.github)}${link("currículo", PERFIL.contato.curriculo)}`
};
const iconsEl = document.getElementById("icons"), winEl = document.getElementById("win"), wbody = document.getElementById("wbody"), wtitle = document.getElementById("wtitle");
ICONS.forEach(ic => {
  const b = document.createElement("button"); b.type = "button"; b.className = "icon"; b.dataset.id = ic.id;
  b.innerHTML = `<span class="ico ${ic.cls}">${ic.cls === "exe" ? "&gt;_" : ""}</span><span class="lbl">${ic.label}</span>`;
  b.addEventListener("click", () => ic.id === "replay" ? replay() : openWin(ic.id));
  iconsEl.appendChild(b);
});
function openWin(id) {
  const ic = ICONS.find(i => i.id === id);
  wtitle.textContent = "C:\\" + ic.label.toUpperCase();
  wbody.innerHTML = WINS[id](); wbody.scrollTop = 0; winEl.hidden = false;
  iconsEl.querySelectorAll(".icon").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const cp = document.getElementById("copyMail");
  if (cp) cp.addEventListener("click", () => {
    const done = () => { cp.textContent = "COPIADO"; setTimeout(() => cp.textContent = "COPIAR", 1500); };
    try { navigator.clipboard.writeText(PERFIL.contato.email).then(done, selectMail); } catch (e) { selectMail(); }
  });
  blip(700);
}
function selectMail() { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function closeWin() { winEl.hidden = true; iconsEl.querySelectorAll(".icon").forEach(b => b.classList.remove("on")); }
document.getElementById("wclose").addEventListener("click", closeWin);

function openDesktop(skipped) {
  runId++; clearTimeout(typeTimer); typing = false; talking = false; busy = false; fade = 0;
  stageEl.hidden = true; dialogEl.hidden = true; helpEl.hidden = true; deskEl.hidden = false;
  document.getElementById("btnSkip").hidden = true;
  document.getElementById("tip").innerHTML = `<b>* ${esc(PERFIL.curto)}:</b> ${skipped ? "Com pressa? Sem problema. Tá tudo aqui." : "Fica à vontade. Clica numa pasta."}`;
  if (skipped) openWin("sobre"); else closeWin();
  const first = iconsEl.querySelector(".icon"); first && first.focus({ preventScroll: true });
}
function replay() {
  runId++; closeWin(); deskEl.hidden = true; stageEl.hidden = false; dialogEl.hidden = false; helpEl.hidden = false;
  document.getElementById("btnSkip").hidden = false;
  scene = "fantasy"; cam = { x: 96, y: 54, z: 1 }; fade = 0; known = false; busy = false;
  started = true; titleEl.hidden = true; initAudio(); go("f1");
}

document.getElementById("btnSkip").addEventListener("click", () => openDesktop(true));
const bs = document.getElementById("btnSound");
bs.addEventListener("click", () => { muted = !muted; bs.textContent = muted ? "SOM: OFF" : "SOM: ON"; bs.setAttribute("aria-pressed", String(!muted)); if (!muted) initAudio(); });
document.getElementById("brandName").textContent = PERFIL.nome.toUpperCase();
const clock = document.getElementById("clock");
const tickClock = () => { const d = new Date(); clock.textContent = `ANO 2087 · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
tickClock(); setInterval(tickClock, 15000);

if (location.hash === "#perfil") openDesktop(true);
requestAnimationFrame(render);
</script>
